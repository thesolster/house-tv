<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>House TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=VT323&family=Press+Start+2P&family=Righteous&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="skins/guide.css">
<link rel="stylesheet" href="skins/seventies.css">
<link rel="stylesheet" href="skins/teletext.css">
<link rel="stylesheet" href="skins/surf.css">
<link rel="stylesheet" href="view.css">
</head>
<body>
<div id="stage">

  <!-- Top half: what you're on, playing live, and what it is -->
  <section id="preview">
    <div id="pv-photo" class="pv"></div>
    <iframe id="pv-live" class="pv" title="Preview" scrolling="no" tabindex="-1"></iframe>
    <div id="pv-card" class="pv"><div id="pv-card-kicker"></div><div id="pv-card-title"></div></div>
    <img id="pv-banner" class="pv" alt="">
    <div id="pv-credit"></div>
    <div id="pv-ch"></div>
  </section>

  <section id="info">
    <div id="info-top">
      <div>
        <div id="clock">--:--</div>
        <div id="date"></div>
      </div>
      <div id="weather"></div>
    </div>
    <div id="note" class="note"></div>
    <div id="hl">
      <div id="hl-kicker"></div>
      <div id="hl-title"></div>
      <div id="hl-sub"></div>
      <div id="hl-hint"></div>
    </div>
    <div id="info-bottom">
      <div id="np" class="hidden">
        <div id="np-app"></div>
        <div id="np-title"></div>
        <div class="np-bar"><div id="np-fill"></div></div>
      </div>
      <div id="remote" class="hidden"><div id="qr"></div><div class="remote-text">Phone<br>remote</div></div>
    </div>
  </section>

  <!-- Bottom half: the guide. Every row is a channel. -->
  <section id="guide">
    <div id="guide-head">
      <div class="gh-left">House guide</div>
      <div class="gh-right"><span id="build"></span>▲ ▼ channels · ◀ ▶ shows · OK to watch · ▲ at the top to go big</div>
    </div>
    <div id="guide-window"><div id="guide-rows"></div></div>
  </section>

  <div id="view-strip"></div>
  <div id="view-hint">▲ ▼ change channel · ◀ ▶ more on this channel · OK to watch · Back for the guide</div>

  <div id="ambient">
    <div id="ambient-clock">--:--</div>
    <div id="ambient-date"></div>
    <div id="ambient-summary"></div>
    <div id="ambient-note" class="note"></div>
  </div>

  <footer id="ticker">
    <div class="tag">Santa Cruz</div>
    <div class="belt"><div class="strip" id="strip"></div></div>
  </footer>

  <div id="toast"></div>
  <div id="crt" aria-hidden="true"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
