<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>House TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="photo"><div class="ph a"></div><div class="ph b"></div></div>
  <div id="glow"></div>
  <div id="photo-credit"></div>

  <header id="top">
    <div class="where">
      <div class="label">Home</div>
      <div class="place">Santa Cruz</div>
      <div id="build"></div>
    </div>
    <div class="now">
      <div id="clock">--:--</div>
      <div id="date"></div>
    </div>
  </header>

  <section id="hero">
    <h1 id="greeting">Hello.</h1>
    <p id="summary">&nbsp;</p>
    <p id="note" class="note"></p>
  </section>

  <aside id="side">
    <div id="np" class="card hidden">
      <div class="np-app" id="np-app"></div>
      <div class="np-title" id="np-title"></div>
      <div class="np-sub" id="np-sub"></div>
      <div class="np-bar"><div id="np-fill"></div></div>
      <div class="np-state" id="np-state"></div>
    </div>
    <div id="remote" class="card hidden">
      <div id="qr"></div>
      <div class="remote-text">
        <div class="remote-title">Phone remote</div>
        <div class="remote-sub">Scan on the house wifi</div>
      </div>
    </div>
  </aside>

  <div id="rowsClip">
    <main id="rows">
      <section class="row hidden" id="row-watched">
        <h2>Last watched</h2>
        <div class="track"><div class="tiles" id="watched"></div></div>
      </section>
      <section class="row hidden" id="row-tonight">
        <h2>Tonight in Santa Cruz <span class="from">from Regular</span></h2>
        <div class="track"><div class="tiles" id="tonight"></div></div>
      </section>
      <section class="row hidden" id="row-recent">
        <h2>Recent</h2>
        <div class="track"><div class="tiles" id="recent"></div></div>
      </section>
      <section class="row" id="row-live">
        <h2>Live around town</h2>
        <div class="track"><div class="tiles" id="live"></div></div>
      </section>
      <section class="row" id="row-apps">
        <h2>All apps</h2>
        <div class="track"><div class="tiles" id="apps"></div></div>
      </section>
      <section class="row" id="row-inputs">
        <h2>Inputs &amp; settings</h2>
        <div class="track"><div class="tiles" id="inputs"></div></div>
      </section>
    </main>
  </div>

  <div id="ambient">
    <div id="ambient-clock">--:--</div>
    <div id="ambient-date"></div>
    <div id="ambient-summary"></div>
    <div id="ambient-note" class="note"></div>
  </div>

  <footer id="ticker">
    <div class="tag">Santa Cruz</div>
    <div class="belt"><div class="strip" id="strip"></div></div>
  </footer>

  <div id="toast"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
